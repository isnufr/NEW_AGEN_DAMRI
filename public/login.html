<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Agen Damri Kawunganten</title>
    <link rel="manifest" href="/manifest-admin.json">
    <script src="https://cdn.tailwindcss.com?v=2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="app.js?v=5" defer></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .bg-pattern { background-image: radial-gradient(rgba(245, 158, 11, 0.2) 1px, transparent 1px); background-size: 20px 20px; opacity: 0.15; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-950 relative min-h-screen flex items-center justify-center overflow-hidden">
    <!-- Pattern Background -->
    <div class="absolute inset-0 bg-pattern pointer-events-none z-0"></div>

    <!-- Login Card -->
    <div class="relative z-10 bg-slate-800/80 backdrop-blur-xl p-8 sm:p-10 rounded-[2.5rem] shadow-2xl shadow-black/50 border border-slate-700 max-w-md w-full mx-4">
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-gradient-to-br from-amber-400 to-amber-600 rounded-3xl mx-auto mb-4 flex items-center justify-center shadow-[0_0_30px_rgba(245,158,11,0.3)] ring-4 ring-amber-500/20 ring-offset-4 ring-offset-slate-800">
                <i class="fas fa-user-shield text-3xl text-slate-900"></i>
            </div>
            <h1 class="text-3xl font-black text-white tracking-tighter uppercase italic">Admin Panel</h1>
            <p class="text-xs font-bold text-amber-500 uppercase tracking-widest mt-2">Agen Damri Kawunganten</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
            <div>
                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Username</label>
                <div class="relative">
                    <i class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="username" required
                        class="w-full bg-slate-900/50 border border-slate-700 text-white text-sm rounded-2xl focus:ring-2 focus:ring-amber-500 focus:border-amber-500 block pl-11 p-4 font-bold outline-none transition-all placeholder:text-slate-500"
                        placeholder="Masukkan username">
                </div>
            </div>
            <div>
                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Password</label>
                <div class="relative">
                    <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="password" id="password" required
                        class="w-full bg-slate-900/50 border border-slate-700 text-white text-sm rounded-2xl focus:ring-2 focus:ring-amber-500 focus:border-amber-500 block pl-11 p-4 font-bold outline-none transition-all placeholder:text-slate-500"
                        placeholder="Masukkan password">
                </div>
            </div>
            
            <button type="submit" id="loginBtn"
                class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-900 rounded-2xl py-4 px-5 text-sm font-black uppercase tracking-widest shadow-[0_10px_20px_-10px_rgba(245,158,11,0.5)] transition-all active:scale-95 flex justify-center items-center gap-2 mt-4">
                <i class="fas fa-sign-in-alt"></i> MASUK
            </button>
        </form>

        <!-- Custom Alert -->
        <div id="loginAlert" class="hidden mt-4 p-4 rounded-xl text-center text-xs font-bold uppercase tracking-widest transition-all"></div>

        <div class="mt-8 text-center border-t border-slate-700 pt-6">
            <a href="index.html" class="text-[10px] font-black text-slate-400 hover:text-amber-500 uppercase tracking-widest transition-colors">
                <i class="fas fa-arrow-left mr-1"></i> Kembali ke Beranda
            </a>
        </div>
    </div>

    <script>
        // Cek login
        if (localStorage.getItem('isAdminLoggedIn') === 'true') {
            window.location.href = 'admin.html';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const alertBox = document.getElementById('loginAlert');

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> MEMERIKSA...';
            btn.disabled = true;
            alertBox.classList.add('hidden');

            try {
                const res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        action: 'loginAdmin',
                        payload: { username: u, password: p }
                    })
                });
                
                const json = await res.json();

                if (json.status === 'success') {
                    localStorage.setItem('isAdminLoggedIn', 'true');
                    if (json.token) localStorage.setItem('adminToken', json.token);
                    alertBox.innerText = "Login Berhasil! Mengalihkan...";
                    alertBox.className = "mt-4 p-4 rounded-xl text-center text-xs font-bold uppercase tracking-widest bg-green-100 text-green-700 block animate-fade-in-up";
                    setTimeout(() => window.location.href = 'admin.html', 1000);
                } else {
                    alertBox.innerText = json.message || "Username atau password salah!";
                    alertBox.className = "mt-4 p-4 rounded-xl text-center text-xs font-bold uppercase tracking-widest bg-red-100 text-red-700 block animate-fade-in-up";
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> MASUK';
                    btn.disabled = false;
                }
            } catch (error) {
                console.error("Login fetch error:", error);
                alertBox.innerText = "Gagal menghubungi database! Pastikan internet stabil dan script API benar.";
                alertBox.className = "mt-4 p-4 rounded-xl text-center text-xs font-bold uppercase tracking-widest bg-red-100 text-red-700 block animate-fade-in-up";
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> MASUK';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
